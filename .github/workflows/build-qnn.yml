name: WARDNET QNN Shell Boundary Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Qualcomm QNN public headers
        uses: actions/checkout@v6
        with:
          repository: qualcomm/geniex-qairt-plugin
          ref: main
          path: qnn_headers
          sparse-checkout: |
            qnn-api/include
          sparse-checkout-cone-mode: true

      - name: Set up Android command-line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK (compiler only)
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;29.0.13599879'

      - name: Fetch Qualcomm QNN 2.44.0 runtime libraries
        run: |
          set -euo pipefail
          mkdir -p output
          curl --fail --location --retry 3 \
            'https://repo.maven.apache.org/maven2/com/qualcomm/qti/qnn-runtime/2.44.0/qnn-runtime-2.44.0.aar' \
            --output /tmp/qnn-runtime-2.44.0.aar
          unzip -j -o /tmp/qnn-runtime-2.44.0.aar \
            'jni/arm64-v8a/*.so' -d output
          test -s output/libQnnHtp.so
          test -s output/libQnnHtpV75Stub.so
          test -s output/libQnnHtpV75Skel.so

      - name: Create portable shell-side QNN deviceCreate probe
        run: |
          set -euo pipefail
          cat > /tmp/wardnet_qnn_shell_probe.c <<'WARDNET_QNN_SHELL_SOURCE'
          #include <QnnInterface.h>
          #include <dlfcn.h>
          #include <inttypes.h>
          #include <stdarg.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          
          static void qnnLog(const char *fmt, QnnLog_Level_t level, uint64_t timestamp, va_list args) {
              (void)level; (void)timestamp;
              fprintf(stdout, "QNN: ");
              vfprintf(stdout, fmt, args);
              fprintf(stdout, "\n");
              fflush(stdout);
          }
          
          int main(int argc, char **argv) {
              if (argc != 2) {
                  fprintf(stderr, "Usage: %s /absolute/path/to/qnn/libs\n", argv[0]);
                  return 2;
              }
              char path[1024];
              if (snprintf(path, sizeof(path), "%s/libQnnHtp.so", argv[1]) >= (int)sizeof(path)) {
                  fprintf(stderr, "ERROR: path too long\n");
                  return 2;
              }
              setenv("ADSP_LIBRARY_PATH", argv[1], 1);
              setenv("DSP_LIBRARY_PATH", argv[1], 1);
              printf("QNN Shell Probe — effective uid=%d, backend path=%s\n", (int)getuid(), path);
              printf("Required: QNN backendCreate AND deviceCreate. No model/inference.\n");
              fflush(stdout);
              void *handle = dlopen(path, RTLD_NOW | RTLD_LOCAL);
              if (!handle) {
                  fprintf(stderr, "FAIL dlopen: %s\n", dlerror());
                  return 3;
              }
              typedef Qnn_ErrorHandle_t (*GetProvidersFn)(const QnnInterface_t***, uint32_t*);
              GetProvidersFn getProviders = (GetProvidersFn)dlsym(handle, "QnnInterface_getProviders");
              if (!getProviders) { fprintf(stderr, "FAIL missing QnnInterface_getProviders\n"); return 3; }
              const QnnInterface_t **providers = NULL;
              uint32_t count = 0;
              Qnn_ErrorHandle_t rc = getProviders(&providers, &count);
              printf("getProviders=%llu count=%u\n", (unsigned long long)rc, count);
              if (rc != QNN_SUCCESS || !providers || count == 0) return 4;
              const QnnInterface_t *p = NULL;
              for (uint32_t i = 0; i < count; ++i) {
                  if (providers[i] && providers[i]->apiVersion.coreApiVersion.major == QNN_API_VERSION_MAJOR &&
                      providers[i]->apiVersion.coreApiVersion.minor >= QNN_API_VERSION_MINOR) {
                      p = providers[i];
                      break;
                  }
              }
              if (!p) { fprintf(stderr, "FAIL no matching QNN provider\n"); return 4; }
              const typeof(p->QNN_INTERFACE_VER_NAME) *api = &p->QNN_INTERFACE_VER_NAME;
              Qnn_LogHandle_t logger = NULL;
              if (api->logCreate) {
                  rc = api->logCreate(qnnLog, QNN_LOG_LEVEL_INFO, &logger);
                  printf("logCreate=%llu\n", (unsigned long long)rc);
                  if (rc != QNN_SUCCESS) logger = NULL;
              }
              Qnn_BackendHandle_t backend = NULL;
              rc = api->backendCreate(logger, NULL, &backend);
              printf("backendCreate=%llu (0x%llx)\n", (unsigned long long)rc, (unsigned long long)rc);
              if (rc != QNN_SUCCESS || !backend) return 5;
              Qnn_DeviceHandle_t device = NULL;
              rc = api->deviceCreate(logger, NULL, &device);
              printf("deviceCreate=%llu (0x%llx)\n", (unsigned long long)rc, (unsigned long long)rc);
              if (rc == QNN_SUCCESS && device) printf("PASS: QNN HTP device initialization as shell UID\n");
              else printf("FAIL: QNN HTP device initialization as shell UID\n");
              if (device && api->deviceFree) api->deviceFree(device);
              if (backend && api->backendFree) api->backendFree(backend);
              if (logger && api->logFree) api->logFree(logger);
              dlclose(handle);
              return (rc == QNN_SUCCESS) ? 0 : 6;
          }
          WARDNET_QNN_SHELL_SOURCE
          test -s /tmp/wardnet_qnn_shell_probe.c
          QNN_HEADERS="$GITHUB_WORKSPACE/qnn_headers/qnn-api/include"
          NDK="${ANDROID_HOME}/ndk/29.0.13599879"
          CC="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          test -s "$QNN_HEADERS/QnnInterface.h"
          test -x "$CC"
          "$CC" -std=gnu11 -O2 -Wall -Wextra -fPIE -pie \
            -I "$QNN_HEADERS" \
            /tmp/wardnet_qnn_shell_probe.c -ldl -o output/qnn_shell_probe
          file output/qnn_shell_probe
          test -s output/qnn_shell_probe

      - name: Save integrity hashes
        run: |
          set -euo pipefail
          (cd output && sha256sum qnn_shell_probe libQnnHtp.so libQnnHtpV75Stub.so libQnnHtpV75Skel.so > SHA256SUMS.txt)

      - name: Upload independent shell test bundle
        uses: actions/upload-artifact@v4
        with:
          name: WARDNET-QNN-Shell-Boundary
          path: output/
          if-no-files-found: error
          retention-days: 7
