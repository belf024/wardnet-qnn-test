name: Build isolated QNN HTP test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout upstream HTP test source
        uses: actions/checkout@v4
        with:
          repository: pytorch/executorch
          ref: main
          path: upstream
          sparse-checkout: |
            examples/qualcomm/qnn-htp-test
          sparse-checkout-cone-mode: true

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK, NDK and CMake components
        run: |
          sdkmanager --install \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;29.0.13599879' \
            'cmake;3.22.1'

      - name: Download Qualcomm QNN runtime 2.44.0
        working-directory: upstream/examples/qualcomm/qnn-htp-test
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://repo.maven.apache.org/maven2/com/qualcomm/qti/qnn-runtime/2.44.0/qnn-runtime-2.44.0.aar' \
            --output /tmp/qnn-runtime-2.44.0.aar
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -j -o /tmp/qnn-runtime-2.44.0.aar \
            'jni/arm64-v8a/*.so' \
            -d app/src/main/jniLibs/arm64-v8a
          test -s app/src/main/jniLibs/arm64-v8a/libQnnHtp.so
          test -s app/src/main/jniLibs/arm64-v8a/libQnnHtpV75Stub.so

      - name: Build standalone QNN HTP test APK
        working-directory: upstream/examples/qualcomm/qnn-htp-test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and hash resulting APK
        run: |
          set -euo pipefail
          apk='upstream/examples/qualcomm/qnn-htp-test/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          sha256sum "$apk" | tee QNN-HTP-Test-SHA256.txt
          ls -lh "$apk"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: WARDNET-QNN-HTP-Test-APK
          path: |
            upstream/examples/qualcomm/qnn-htp-test/app/build/outputs/apk/debug/app-debug.apk
            QNN-HTP-Test-SHA256.txt
          if-no-files-found: error
          retention-days: 7
